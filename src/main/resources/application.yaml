spring:
  application:
    name: binance-price-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/binance_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}