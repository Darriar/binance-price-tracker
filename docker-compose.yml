services:
  postgres:
    image: postgres:16-alpine
    container_name: binance-price-tracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-binance_prices}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-binance_prices}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: binance-price-tracker-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-binance_prices}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BINANCE_SYMBOL: ${BINANCE_SYMBOL:-BNBUSDT}
      BINANCE_POLL_INTERVAL: ${BINANCE_POLL_INTERVAL:-PT30S}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}

volumes:
  postgres_data: